<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf2f8" />
    <title>Daily Affirmations</title>

    <!-- Playful, rounded display font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Hide scrollbars everywhere, app-like feel */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* ---------- micro-animation keyframes ---------- */
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pop {
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes floatIn {
        0% {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-float-in {
        animation: floatIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow {
        animation: spin-slow 1.1s linear infinite;
      }

      @keyframes slideUp {
        0% {
          opacity: 0;
          transform: translateY(100%);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
